<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef0f8">
<title>Consigli di risparmio</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Clima di casa">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<script src="supa.js"></script>
<script src="gate.js"></script>
</head>
<body>
<main id="app"></main>
<script src="schedule.js"></script>
<script src="novita.js"></script>
<script src="common.js"></script>
<script>
(function () {
  var U = window.UI, S = window.SCHED, cur = S.stagioneOggi(new Date()) === 'estate' ? 'estate' : 'inverno';
  var TIPS = {
    inverno: {
      oro: [['1', 'Pompa di calore al posto della caldaia: il gas resta solo per acqua calda e cucina.'], ['2', 'Acceso solo quando sei in casa, spento fuori casa e di notte.'], ['3', '19 °C a novembre e marzo, 20 °C da dicembre a febbraio. Mai oltre.']],
      tips: [
        ['thermo', 'Ogni grado in meno conta', 'Indicativamente ogni grado in meno riduce il consumo del 5–8%. Parti dai valori del mese e scendi di 1 °C se stai bene.', 'hi', 'Alto'],
        ['power', 'Spegni quando esci e di notte', 'Il condizionatore scalda l’aria in 30–45 minuti: non serve tenerlo acceso a vuoto.', 'hi', 'Alto'],
        ['moon', 'Spegni 20 minuti prima di dormire', 'Il caldo resta in casa per un po’. Sono minuti di consumo che non servono.', 'md', 'Medio'],
        ['door', 'Scalda solo dove stai', 'Porte chiuse nelle stanze non usate e unità spenta dove non c’è nessuno.', 'md', 'Medio'],
        ['window', 'Sfrutta il sole', 'Tende aperte di giorno sul lato sole, chiuse la sera. Ricambia l’aria 5–10 minuti con le finestre spalancate, poi richiudi.', 'md', 'Medio'],
        ['filter', 'Filtri e unità esterna', 'Filtri puliti ogni mese, unità esterna libera da foglie e ostacoli: lavora meglio e consuma meno.', 'md', 'Medio'],
        ['bolt', 'Contatore da 3 kW', 'Non accendere insieme condizionatore, forno e piastra. Aumentare la potenza costa circa 2 € al mese per ogni kW in più: evitalo se non serve.', 'md', 'Medio'],
        ['euro', 'Controlla il prezzo della luce', 'Con più kWh in bolletta il prezzo al kWh pesa di più. Verifica le offerte sul Portale Offerte ARERA quando arriva la comunicazione del fornitore.', 'md', 'Medio'],
        ['eye', 'Leggi i kWh durante la prova', 'Annota i consumi ogni giorno e confrontali con quelli del mese prima: ti dice subito se i set point sono troppo alti.', 'lo', 'Basso']
      ]
    },
    estate: {
      oro: [['1', '27 °C a luglio e agosto, 26 °C a giugno e settembre. Non scendere sotto.'], ['2', 'Acceso solo la sera e quando sei in casa. Mai fuori casa.'], ['3', 'Persiane chiuse sul lato sole e finestre aperte al mattino presto.']],
      tips: [
        ['sun', 'Blocca il sole prima che entri', 'Persiane, tapparelle o tende esterne chiuse sul lato sole: è il risparmio più grande, perché il caldo non entra proprio.', 'hi', 'Alto'],
        ['thermo', 'Ogni grado in più conta', 'Indicativamente ogni grado in più riduce il consumo del 5–8%. Tieni 26–27 °C: più freddo costa e non fa bene.', 'hi', 'Alto'],
        ['power', 'Spento fuori casa', 'Non lasciarlo acceso per trovare casa fresca: la sera lavora al massimo per 20–30 minuti e basta.', 'hi', 'Alto'],
        ['fan', 'Aggiungi un ventilatore', 'Il movimento d’aria ti fa sentire più fresco: puoi alzare il set point di 1–2 °C.', 'md', 'Medio'],
        ['drop', 'Usa Deumidifica', 'Con molta umidità (settembre, giorni afosi) la modalità Deumidifica consuma meno e dà comfort.', 'md', 'Medio'],
        ['moon', 'Notti tropicali', 'Se non si dorme, usa il timer: 1–2 ore a 27–28 °C e poi spento, invece di tutta la notte.', 'md', 'Medio'],
        ['bolt', 'Forno e piastra nelle ore fresche', 'Cucina presto o tardi e usa il forno il meno possibile: ogni cottura aggiunge caldo che poi devi togliere.', 'md', 'Medio'],
        ['filter', 'Filtri puliti, unità esterna all’ombra', 'Filtri puliti ogni mese e unità esterna libera e il più possibile all’ombra.', 'md', 'Medio'],
        ['shield', 'Differenza contenuta con l’esterno', 'Tieni la differenza tra dentro e fuori entro 8 °C: meno shock termico quando entri ed esci.', 'lo', 'Basso']
      ]
    }
  };
  var app = document.getElementById('app');
  function render() {
    var T = TIPS[cur], emb = cur === 'inverno' ? 'snow' : 'sun';
    U.applyHue(cur === 'inverno' ? 215 : 20);
    app.innerHTML =
      '<div class="hd"><a class="back" href="index.html">' + U.I('back') + 'Stagioni</a><span class="emb" aria-hidden="true">' + U.I(emb) + '</span></div>' +
      '<div><h1>Consigli di risparmio</h1><p>Come spendere il meno possibile, senza stare male.</p></div>' +
      '<div class="seg" role="group" aria-label="Stagione"><button type="button" data-k="inverno" aria-pressed="' + (cur === 'inverno') + '">' + U.I('snow') + 'Inverno</button><button type="button" data-k="estate" aria-pressed="' + (cur === 'estate') + '">' + U.I('sun') + 'Estate</button></div>' +
      '<div class="hero sm2" style="margin-top:12px"><div style="min-width:0"><small>Le 3 regole d’oro</small><div class="gold" style="margin-top:10px;color:#fff">' +
      T.oro.map(function (g) { return '<div><b style="color:#fff">' + (g[0].length > 1 ? '•' : g[0]) + '</b><span style="font-weight:600;font-size:16px;line-height:1.3">' + g[1] + '</span></div>'; }).join('') +
      '</div></div></div>' +
      '<h2>Cosa fare</h2><section class="card" style="padding:4px 16px">' +
      T.tips.map(function (t) { return '<div class="tip"><span class="ic">' + U.I(t[0]) + '</span><div><h3><span>' + t[1] + '</span><span class="bd ' + t[3] + '">' + t[4] + '</span></h3><p>' + t[2] + '</p></div></div>'; }).join('') + '</section>' +
      '<p class="sm" style="text-align:center">L’impatto è una stima: dipende da casa, modello e clima.</p>' +
      '<a class="btn" href="' + (cur === 'inverno' ? 'inverno.html' : 'estate.html') + '">Vai alle temperature ' + (cur === 'inverno' ? 'd’inverno' : 'd’estate') + '</a>';
    app.querySelector('.seg').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; cur = b.getAttribute('data-k'); render(); });
  }
  render(); U.nav('consigli');
})();
</script>
</body>
</html>
